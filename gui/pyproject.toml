[project]
name = "animeexpedition-gui"
version = "0.4.0"
description = "PySide6 presentation process for Kimberlite's Anime Expedition Macro"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ipc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
