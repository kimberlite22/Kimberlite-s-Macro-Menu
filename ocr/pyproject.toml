[project]
name = "ocr-helper"
version = "1.0.0"
description = "Windows OCR helper for Kimberlite's Macro Menu (Python replacement for ocr_server.ps1 / ocr_region.ps1)"
requires-python = ">=3.10"
dependencies = [
    # winsdk has no stable 1.0.0 release yet on PyPI (only 1.0.0bN pre-releases), so the
    # lower bound must explicitly allow pre-releases or `pip install .` cannot resolve it.
    "winsdk>=1.0.0b1",
    # mss.MSS (the capitalized class used in engine.py) and the shot.raw property this code
    # relies on are only guaranteed on the 10.2.x line actually tested against; mss has no
    # upper-bound-safe API contract across majors (shot.raw is slated for removal in a future
    # major release), so pin narrowly rather than allowing an untested >=9.0.0 range.
    "mss>=10.2.0,<11.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]
# A normal production build must never install this group. EasyOCR and PaddleOCR each
# pull in a roughly gigabyte-sized deep-learning framework, so ocr_benchmark.exe is
# deliberately built and shipped separately from the small ocr_server.exe.
benchmark = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
ocr-helper = "ocr_helper.cli:main"
ocr-benchmark = "ocr_helper.benchmark_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocr_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
