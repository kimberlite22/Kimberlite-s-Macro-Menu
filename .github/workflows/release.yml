name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0."
          }
          $version = $Matches[1]
          $source = Get-Content -LiteralPath 'macro/tower_defense_macro_gui.ahk' -Raw
          $versionMatch = [regex]::Match($source, 'AppVersion\s*:=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw 'AppVersion was not found in the AutoHotkey source.'
          }
          $sourceVersion = $versionMatch.Groups[1].Value
          if ($sourceVersion -ne $version) {
            throw "Tag $tag does not match AppVersion $sourceVersion in the AutoHotkey source."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create version tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin --force --tags
          $headCommit = git rev-parse HEAD
          $existingTag = git tag --list $env:RELEASE_TAG
          if ($existingTag -eq $env:RELEASE_TAG) {
            $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagCommit -ne $headCommit) {
              throw "Tag $env:RELEASE_TAG already exists on commit $tagCommit, but this run uses $headCommit."
            }
            Write-Host "Tag $env:RELEASE_TAG already exists on this commit; reusing it."
          } else {
            git tag $env:RELEASE_TAG
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not push tag $env:RELEASE_TAG."
            }
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: remote/agent/go.mod

      - name: Build remote agent EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location remote/agent
          try {
            go build -o animeexpedition-agent.exe .
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath 'remote/agent/animeexpedition-agent.exe')) {
            throw 'go build did not produce remote/agent/animeexpedition-agent.exe.'
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build OCR helper EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location ocr
          try {
            python -m pip install --upgrade pip
            pip install .[dev]
            pyinstaller --onefile --name ocr_server --distpath dist --workpath build --specpath build ocr_helper/cli.py
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath 'ocr/dist/ocr_server.exe')) {
            throw 'PyInstaller did not produce ocr/dist/ocr_server.exe.'
          }
          Copy-Item -LiteralPath 'ocr/dist/ocr_server.exe' -Destination 'macro/ocr_server.exe' -Force

      - name: Download official AutoHotkey compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Kimberlites-Anime-Expedition-Macro release workflow'
          }
          New-Item -ItemType Directory -Path '.build/ahk', '.build/compiler' -Force | Out-Null

          $ahkRelease = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest'
          $ahkAsset = @($ahkRelease.assets | Where-Object { $_.name -match '^AutoHotkey_.*\.zip$' })[0]
          if (-not $ahkAsset) { throw 'The latest official AutoHotkey v2 ZIP was not found.' }
          Invoke-WebRequest -Headers $headers -Uri $ahkAsset.browser_download_url -OutFile '.build/AutoHotkey.zip'
          Expand-Archive -LiteralPath '.build/AutoHotkey.zip' -DestinationPath '.build/ahk' -Force

          $compilerRelease = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest'
          $compilerAsset = @($compilerRelease.assets | Where-Object { $_.name -match '\.zip$' })[0]
          if (-not $compilerAsset) { throw 'The latest official Ahk2Exe ZIP was not found.' }
          Invoke-WebRequest -Headers $headers -Uri $compilerAsset.browser_download_url -OutFile '.build/Ahk2Exe.zip'
          Expand-Archive -LiteralPath '.build/Ahk2Exe.zip' -DestinationPath '.build/compiler' -Force

      - name: Compile Windows engine EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $compiler = Get-ChildItem -LiteralPath '.build/compiler' -Recurse -Filter 'Ahk2Exe.exe' | Select-Object -First 1
          $base = Get-ChildItem -LiteralPath '.build/ahk' -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Ahk2Exe.exe was not found after extraction.' }
          if (-not $base) { throw 'AutoHotkey64.exe was not found after extraction.' }

          $inputPath = "$PWD/macro/tower_defense_macro_gui.ahk"
          $outputPath = "$PWD/dist/Kimberlites-Anime-Expedition-Macro.exe"
          $arguments = '/in "{0}" /out "{1}" /base "{2}"' -f $inputPath, $outputPath, $base.FullName
          $iconPath = "$PWD/assets/app.ico"
          if (Test-Path -LiteralPath $iconPath) {
            $arguments += ' /icon "{0}"' -f $iconPath
          }
          $process = Start-Process -FilePath $compiler.FullName -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Ahk2Exe failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath 'dist/Kimberlites-Anime-Expedition-Macro.exe')) {
            throw 'Ahk2Exe did not create the expected output file.'
          }
          # v0.2.0 and older hard-code this asset name in their updater. Keep an identical alias so
          # those installations can download the first branded release and migrate themselves.
          Copy-Item -LiteralPath 'dist/Kimberlites-Anime-Expedition-Macro.exe' `
            -Destination 'dist/Anime-Expedition-Macro.exe'

      - name: Build GUI EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolved BEFORE Push-Location gui below, since both live outside the gui/ folder: the
          # engine exe was just compiled by "Compile Windows engine EXE" into dist/ at the repo root,
          # and VERSION is a repo-root file. gui.exe embeds the engine exe as bundled binary data
          # (PyInstaller --add-binary, landing under an "engine" subfolder inside the frozen bundle)
          # so gui.exe can extract and launch it hidden at runtime instead of assuming it is already
          # running - see gui/app/engine_process.py. VERSION is embedded the same way style.qss
          # already is (--add-data, destination ".", the bundle root) so gui.exe can compare its own
          # version against update.ini without hard-coding a version string in Python source.
          $engineSrc = (Resolve-Path 'dist/Kimberlites-Anime-Expedition-Macro.exe').Path
          $versionSrc = (Resolve-Path 'VERSION').Path
          Push-Location gui
          try {
            pip install .[dev]
            # --paths . lets PyInstaller's static import analysis (starting from app/main.py) find
            # the sibling app/ipc packages; without it the built exe crashes with "No module named
            # 'app'" the moment it runs, since that only resolves at runtime via main.py's own
            # sys.path manipulation. The style.qss data file's destination must be "." (bundle root),
            # not "app": the frozen onefile entry script's __file__ resolves at the bundle root, not
            # under an app/ subfolder, so main.py's existing style.qss lookup would otherwise raise
            # FileNotFoundError at startup. Both failure modes were confirmed by actually building
            # and running the exe, not just by reading the command - `Test-Path` below alone would
            # not have caught either, since the build itself still succeeds either way.
            $styleSrc = (Resolve-Path 'app\style.qss').Path
            pyinstaller --windowed --onefile --paths . `
              --add-data "$styleSrc;." `
              --add-data "$versionSrc;." `
              --add-binary "$engineSrc;engine" `
              --name gui --distpath dist --workpath build --specpath build app/main.py
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath 'gui/dist/gui.exe')) {
            throw 'PyInstaller did not produce gui/dist/gui.exe.'
          }

      - name: Smoke-test GUI EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Path 'gui/smoke-test-dir' -Force | Out-Null
          $process = Start-Process -FilePath (Resolve-Path 'gui/dist/gui.exe').Path `
            -ArgumentList '--dir', (Resolve-Path 'gui/smoke-test-dir').Path -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "gui.exe exited unexpectedly with code $($process.ExitCode) - see gui/BUILD.md's known packaging pitfalls."
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          # An explicit --dir was passed above (matching today's smoke test), so this run never tries
          # to self-install or spawn the bundled engine (that path only activates for a real frozen,
          # no-args launch) - it only proves the GUI process itself starts and stays up.

      - name: Create updater metadata
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -LiteralPath 'dist/Kimberlites-Anime-Expedition-Macro.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "version=$env:APP_VERSION"
            "sha256=$hash"
          ) | Set-Content -LiteralPath 'dist/update.ini' -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gui.exe is the new primary download (it self-installs and launches the AHK engine
          # hidden - see gui/app/self_install.py / engine_process.py); the AHK exe stays uploaded
          # unchanged so existing pre-Python-GUI installs keep auto-updating via update.ini exactly
          # as before, rather than being stranded. Renamed to a branded name for the release page
          # only - the self-install target filename inside gui/app/self_install.py stays "gui.exe"
          # regardless of what this download happens to be named.
          Copy-Item -LiteralPath 'gui/dist/gui.exe' -Destination 'dist/Kimberlites-Anime-Expedition-Macro-GUI.exe'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG `
              'dist/Kimberlites-Anime-Expedition-Macro.exe' `
              'dist/Anime-Expedition-Macro.exe' `
              'dist/Kimberlites-Anime-Expedition-Macro-GUI.exe' `
              'dist/update.ini' `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG `
              'dist/Kimberlites-Anime-Expedition-Macro.exe' `
              'dist/Anime-Expedition-Macro.exe' `
              'dist/Kimberlites-Anime-Expedition-Macro-GUI.exe' `
              'dist/update.ini' `
              --verify-tag `
              --generate-notes `
              --title "Kimberlite's Anime Expedition Macro $env:RELEASE_TAG" `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub release failed with exit code $LASTEXITCODE." }
